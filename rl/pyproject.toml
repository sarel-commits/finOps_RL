[project]
name = "finops-rca"
version = "0.1.0"
description = "FinOps cost-anomaly RCA RL environment: procedural generator, sandboxed run_python, deterministic verifier; verifiers v1 taskset."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
verifiers = ["verifiers>=0.4.1,<0.5"]
dev = ["pytest>=8", "openai>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finops_gym", "finops_rca"]
